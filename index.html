<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NewsNeta</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
 margin:0;
 background:#f3f3f3;
 font-family:'Inter','Noto Sans Telugu',sans-serif;
}

header{
 display:flex;
 align-items:center;
 gap:20px;
 background:white;
 padding:10px 20px;
 border-bottom:4px solid red;
 position:sticky;
 top:0;
 z-index:1000;
}

.site-logo{
 height:60px;
 width:auto;
}

.search{
 flex:1;
}

.search input{
 width:100%;
 padding:14px;
 border-radius:30px;
 border:none;
 background:#eee;
}

.live{
 background:red;
 color:white;
 border:none;
 padding:10px 16px;
 border-radius:10px;
 font-weight:bold;
}

nav{
 background:#cc0000;
 overflow:auto;
 white-space:nowrap;
}

nav button{
 background:none;
 border:none;
 color:white;
 padding:14px 18px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

nav button:hover{
 background:#990000;
}

.ticker{
 background:#111;
 color:white;
 padding:10px;
}

.layout{
 display:grid;
 grid-template-columns:1fr 320px;
 gap:20px;
 padding:20px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
}

.card{
 background:white;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
 width:100%;
 height:220px;
 object-fit:cover;
}

.card h3{
 padding:12px;
 font-size:20px;
 line-height:1.4;
}

.widget{
 background:white;
 padding:20px;
 border-radius:12px;
}

@media(max-width:900px){

 .layout{
  grid-template-columns:1fr;
 }

 .cards{
  grid-template-columns:1fr;
 }

}

</style>
</head>

<body>

<header>

<img src="newsneta-logo.jpg" class="site-logo">

<div class="search">
<input placeholder="వార్తలు వెతకండి...">
</div>

<button class="live">LIVE</button>

</header>

<nav>

<button onclick="loadCategory('telangana')">తెలంగాణ</button>

<button onclick="loadCategory('ap')">ఆంధ్రప్రదేశ్</button>

<button onclick="loadCategory('sports')">క్రీడలు</button>

<button onclick="loadCategory('cinema')">సినిమా</button>

</nav>

<div class="ticker">
<marquee id="ticker">లైవ్ వార్తలు లోడ్ అవుతున్నాయి...</marquee>
</div>

<div class="layout">

<main>

<h2 id="pageTitle">తెలంగాణ</h2>

<div class="cards" id="newsContainer"></div>

</main>

<aside>

<div class="widget" id="weather">

Loading Weather...

</div>

</aside>

</div>

<script>

async function loadWeather(){

 try{

  const r = await fetch(
   'https://api.open-meteo.com/v1/forecast?latitude=17.3850&longitude=78.4867&current=temperature_2m'
  );

  const d = await r.json();

  document.getElementById('weather').innerHTML = `
   <h2>హైదరాబాద్ వాతావరణం</h2>
   <h1>${d.current.temperature_2m}°C</h1>
  `;

 }catch(err){

  console.log(err);

 }

}

function fallback(){

 const arr = [
  'https://picsum.photos/600/400?1',
  'https://picsum.photos/600/400?2',
  'https://picsum.photos/600/400?3',
  'https://picsum.photos/600/400?4'
 ];

 return arr[Math.floor(Math.random()*arr.length)];

}

async function loadCategory(cat){

 try{

  document.getElementById('pageTitle').innerText = cat.toUpperCase();

  const r = await fetch('/api/news?cat='+cat+'&t='+Date.now());

  const d = await r.json();

  const box = document.getElementById('newsContainer');

  box.innerHTML = '';

  if(!d.items){

   box.innerHTML = '<h2>No News Available</h2>';

   return;

  }

  d.items.slice(0,12).forEach(item=>{

   box.innerHTML += `
   <div class="card">
    <img src="${fallback()}">
    <h3>${item.title}</h3>
   </div>
   `;

  });

  document.getElementById('ticker').innerHTML =
   d.items.map(x=>x.title).join(' 🔴 ');

 }catch(err){

  console.log(err);

 }

}

loadWeather();

loadCategory('telangana');

setInterval(()=>{
 loadCategory('telangana');
},60000);

</script>

</body>
</html>
